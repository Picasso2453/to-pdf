name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: |
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --clean to-pdf.spec
      - uses: actions/upload-artifact@v4
        with:
          name: to-pdf-exe
          path: dist/To PDF.exe
